<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9d0b0b">

  <title>Christmas Countdown</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      text-align: center;
      background:
        radial-gradient(circle at top, #246c3b 0%, #103e28 45%, #071c13 100%);
    }

    /* SNOW LAYER */
    .snow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .snowflake {
      position: absolute;
      top: -30px;
      color: white;
      opacity: 0.85;
      user-select: none;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.7);

      animation-name: snowfall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes snowfall {
      0% {
        transform:
          translate3d(0, -10vh, 0)
          rotate(0deg);
      }

      50% {
        transform:
          translate3d(var(--drift), 50vh, 0)
          rotate(180deg);
      }

      100% {
        transform:
          translate3d(calc(var(--drift) * -0.5), 110vh, 0)
          rotate(360deg);
      }
    }

    /* COUNTDOWN STAYS ABOVE SNOW */
    .countdown {
      position: relative;
      z-index: 10;
      width: min(900px, 100%);
      padding: 55px 30px;
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.28);
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .tree {
      font-size: clamp(60px, 10vw, 110px);
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 35px;
      font-size: clamp(32px, 6vw, 64px);
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .unit {
      padding: 22px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.12);
    }

    .number {
      display: block;
      font-size: clamp(32px, 7vw, 70px);
      font-weight: 800;
    }

    .label {
      display: block;
      margin-top: 8px;
      font-size: clamp(12px, 2vw, 18px);
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.8;
    }

    .message {
      margin-top: 35px;
      font-size: clamp(20px, 3vw, 30px);
    }

    @media (max-width: 600px) {
      .timer {
        grid-template-columns: repeat(2, 1fr);
      }

      .countdown {
        padding: 35px 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .snowflake {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- Animated snow -->
  <div class="snow" id="snow" aria-hidden="true"></div>

  <!-- Countdown -->
  <main class="countdown">
    <div class="tree">🎄</div>

    <h1>Christmas Countdown</h1>

    <div class="timer">

      <div class="unit">
        <span class="number" id="days">0</span>
        <span class="label">Days</span>
      </div>

      <div class="unit">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>

      <div class="unit">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>

      <div class="unit">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>

    </div>

    <div class="message" id="message">
      Until Christmas! 🎅
    </div>

  </main>

  <script>
    /* COUNTDOWN */

    function updateCountdown() {

      const now = new Date();

      let christmas = new Date(
        now.getFullYear(),
        11,
        25,
        0,
        0,
        0
      );

      if (now > christmas) {
        christmas = new Date(
          now.getFullYear() + 1,
          11,
          25,
          0,
          0,
          0
        );
      }

      const difference = christmas - now;

      const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
      );

      const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
      );

      const seconds = Math.floor(
        (difference / 1000) % 60
      );

      document.getElementById("days").textContent = days;

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }


    /* SNOW GENERATOR */

    function createSnow() {

      const snowContainer = document.getElementById("snow");

      // Lower this number for less snow,
      // increase it for heavier snow.
      const snowflakeCount = 90;

      const symbols = ["❄", "❅", "❆", "•"];

      for (let i = 0; i < snowflakeCount; i++) {

        const snowflake = document.createElement("span");

        snowflake.className = "snowflake";

        snowflake.textContent =
          symbols[Math.floor(Math.random() * symbols.length)];

        // Random horizontal position
        snowflake.style.left =
          Math.random() * 100 + "vw";

        // Different snowflake sizes
        const size = 7 + Math.random() * 18;

        snowflake.style.fontSize =
          size + "px";

        // Larger flakes appear brighter
        snowflake.style.opacity =
          0.3 + Math.random() * 0.7;

        // Different falling speeds
        const duration =
          7 + Math.random() * 13;

        snowflake.style.animationDuration =
          duration + "s";

        // Makes snow already visible immediately
        snowflake.style.animationDelay =
          -(Math.random() * duration) + "s";

        // Random left/right drifting
        const drift =
          (Math.random() * 120) - 60;

        snowflake.style.setProperty(
          "--drift",
          drift + "px"
        );

        snowContainer.appendChild(snowflake);
      }
    }


    /* START EVERYTHING */

    createSnow();

    updateCountdown();

    setInterval(updateCountdown, 1000);

  </script>

</body>
</html>
