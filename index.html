<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#103e28">

  <title>Christmas Countdown</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      text-align: center;
      background:
        radial-gradient(circle at top, #246c3b 0%, #103e28 45%, #071c13 100%);
    }

    .snow {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .snowflake {
      position: absolute;
      top: -30px;
      color: white;
      opacity: 0.85;
      user-select: none;
      pointer-events: none;

      text-shadow:
        0 0 6px rgba(255, 255, 255, 0.7);

      animation-name: snowfall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes snowfall {
      0% {
        transform:
          translate3d(0, -10vh, 0)
          rotate(0deg);
      }

      50% {
        transform:
          translate3d(var(--drift), 50vh, 0)
          rotate(180deg);
      }

      100% {
        transform:
          translate3d(
            calc(var(--drift) * -0.5),
            110vh,
            0
          )
          rotate(360deg);
      }
    }

    .christmas-display {
      position: relative;
      z-index: 10;

      width: min(1280px, 100%);

      display: grid;
      grid-template-columns: 145px minmax(0, 900px) 145px;
      gap: 28px;

      align-items: center;
      justify-content: center;
    }

    .bauble-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      gap: 55px;
    }

    .bauble {
      --bauble-colour: #d4af37;

      position: relative;

      width: 130px;
      height: 160px;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      transform-origin: 50% 0;

      animation:
        baubleSway 4.5s ease-in-out infinite;

      filter:
        drop-shadow(0 10px 12px rgba(0, 0, 0, 0.35));
    }

    .bauble:nth-child(2) {
      animation-delay: -1.4s;
    }

    .bauble:nth-child(3) {
      animation-delay: -2.8s;
    }

    .right-baubles .bauble:nth-child(1) {
      animation-delay: -0.8s;
    }

    .right-baubles .bauble:nth-child(2) {
      animation-delay: -2.2s;
    }

    .right-baubles .bauble:nth-child(3) {
      animation-delay: -3.4s;
    }

    @keyframes baubleSway {
      0%,
      100% {
        transform: rotate(-2.5deg);
      }

      50% {
        transform: rotate(2.5deg);
      }
    }

    .bauble::before {
      content: "";

      position: absolute;
      top: 0;
      left: 50%;

      width: 2px;
      height: 30px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.85),
          rgba(212, 175, 55, 0.5)
        );

      box-shadow:
        0 0 4px rgba(255,255,255,0.4);
    }

    .cap {
      position: absolute;

      top: 25px;
      left: 50%;

      width: 34px;
      height: 25px;

      transform: translateX(-50%);

      z-index: 3;

      border-radius: 7px 7px 4px 4px;

      border:
        2px solid rgba(255, 244, 174, 0.8);

      background:
        linear-gradient(
          90deg,
          #8c6715 0%,
          #ffe797 25%,
          #c49220 50%,
          #fff0a8 75%,
          #8e6715 100%
        );

      box-shadow:
        0 3px 5px rgba(0, 0, 0, 0.4);
    }

    .cap::before {
      content: "";

      position: absolute;

      width: 15px;
      height: 13px;

      left: 50%;
      top: -11px;

      transform: translateX(-50%);

      border:
        3px solid #d8b84c;

      border-bottom: 0;

      border-radius:
        10px 10px 0 0;
    }

    .photo-frame {
      position: relative;

      width: 130px;
      height: 130px;

      overflow: hidden;

      border-radius: 50%;

      border:
        6px solid var(--bauble-colour);

      background: #111;

      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,0.45),
        inset -10px -10px 20px rgba(0,0,0,0.32),
        0 0 14px rgba(255, 220, 90, 0.35),
        0 10px 22px rgba(0,0,0,0.45);
    }

    .photo-frame::after {
      content: "";

      position: absolute;

      top: 10px;
      left: 15px;

      width: 35px;
      height: 22px;

      border-radius: 50%;

      background:
        rgba(255,255,255,0.22);

      transform: rotate(-35deg);

      filter: blur(2px);

      pointer-events: none;
    }

    .photo-frame img {
      width: 100%;
      height: 100%;

      display: block;

      border-radius: 50%;

      object-fit: cover;
      object-position: center;

      transform: scale(1.02);
    }

    /* Different metallic colours */
    .gold {
      --bauble-colour: #e0bb35;
    }

    .red {
      --bauble-colour: #b51c2b;
    }

    .silver {
      --bauble-colour: #d9e0e3;
    }

    .countdown {
      position: relative;
      z-index: 10;

      width: 100%;

      padding: 50px 30px;

      border:
        2px solid rgba(255,255,255,0.25);

      border-radius: 30px;

      background:
        rgba(0, 0, 0, 0.28);

      box-shadow:
        0 25px 70px rgba(0,0,0,0.35);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .sod-logo {
      display: block;
      width: clamp(110px, 16vw, 175px);
      height: auto;

      margin: 0 auto 18px;

      object-fit: contain;

      
      background: transparent;

      filter:
        drop-shadow(0 8px 12px rgba(0, 0, 0, 0.35));
    }
    .tree {
      font-size:
        clamp(55px, 8vw, 100px);

      line-height: 1;

      margin-bottom: 12px;
    }

    h1 {
      margin:
        0 0 35px;

      font-size:
        clamp(32px, 5vw, 64px);

      text-shadow:
        0 4px 12px rgba(0,0,0,0.45);
    }

    .timer {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 15px;
    }

    .unit {
      padding:
        22px 10px;

      border-radius: 20px;

      border:
        1px solid rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.12);

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.09);
    }

    .number {
      display: block;

      font-size:
        clamp(32px, 6vw, 70px);

      font-weight: 800;

      font-variant-numeric:
        tabular-nums;

      text-shadow:
        0 5px 15px rgba(0,0,0,0.4);
    }

    .label {
      display: block;

      margin-top: 8px;

      font-size:
        clamp(12px, 2vw, 18px);

      text-transform: uppercase;

      letter-spacing: 2px;

      opacity: 0.8;
    }

    .message {
      margin-top: 35px;

      font-size:
        clamp(20px, 3vw, 30px);
    }

    @media (max-width: 1050px) {

      body {
        overflow-y: auto;
      }

      .christmas-display {
        grid-template-columns: 1fr;
        gap: 22px;

        max-width: 900px;
      }

      .bauble-column {
        flex-direction: row;
        justify-content: center;

        gap: clamp(20px, 8vw, 75px);
      }

      .left-baubles {
        order: 1;
      }

      .countdown {
        order: 2;
      }

      .right-baubles {
        order: 3;
      }

      .bauble {
        width: 115px;
        height: 140px;
      }

      .photo-frame {
        width: 115px;
        height: 115px;
      }
    }

    @media (max-width: 600px) {

      body {
        padding: 14px;
      }

      .christmas-display {
        gap: 15px;
      }

      .timer {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .countdown {
        padding:
          30px 18px;
      }

      h1 {
        margin-bottom: 25px;
      }

      .bauble-column {
        gap: 12px;
      }

      .bauble {
        width: 88px;
        height: 108px;
      }

      .photo-frame {
        width: 88px;
        height: 88px;

        border-width: 4px;
      }

      .cap {
        top: 20px;

        width: 26px;
        height: 19px;
      }

      .bauble::before {
        height: 25px;
      }

      .message {
        margin-top: 25px;
      }
    }

    @media (max-width: 350px) {

      .bauble {
        width: 76px;
        height: 96px;
      }

      .photo-frame {
        width: 76px;
        height: 76px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .snowflake,
      .bauble {
        animation: none;
      }
    }

  </style>
</head>

<body>

  <div
    class="snow"
    id="snow"
    aria-hidden="true">
  </div>


  <div class="christmas-display">

    <div class="bauble-column left-baubles">

      <div class="bauble gold">

        <div class="cap"></div>

        <div class="photo-frame">
          <img
            src="hf_20261113_165811_7b7ca164-1f04-461c-ae4b-94aa71034296.png"
            alt="Christmas portrait 1">
        </div>

      </div>


      <div class="bauble red">

        <div class="cap"></div>

        <div class="photo-frame">
          <img
            src="hf_20261113_165759_2451ae13-0973-49f2-8973-ef9590b51fe3.png"
            alt="Christmas portrait 2">
        </div>

      </div>


      <div class="bauble silver">

        <div class="cap"></div>

        <div class="photo-frame">
          <img
            src="hf_20261113_165250_bd520391-51f6-4d4b-8a7b-bc55ddad102e.png"
            alt="Christmas portrait 3">
        </div>

      </div>

    </div>

    <main class="countdown">

      <img
        src="SODLOGO.png"
        alt="SOD"
        class="sod-logo">

      <div class="tree">
        🎄
      </div>

      <h1>
        Christmas Countdown
      </h1>



      <div class="timer">

        <div class="unit">

          <span
            class="number"
            id="days">
            0
          </span>

          <span class="label">
            Days
          </span>

        </div>


        <div class="unit">

          <span
            class="number"
            id="hours">
            00
          </span>

          <span class="label">
            Hours
          </span>

        </div>


        <div class="unit">

          <span
            class="number"
            id="minutes">
            00
          </span>

          <span class="label">
            Minutes
          </span>

        </div>


        <div class="unit">

          <span
            class="number"
            id="seconds">
            00
          </span>

          <span class="label">
            Seconds
          </span>

        </div>

      </div>


      <div
        class="message"
        id="message">

        Until Christmas! 🎅

      </div>

    </main>

    <div class="bauble-column right-baubles">

      <div class="bauble red">

        <div class="cap"></div>

        <div class="photo-frame">
          <img
            src="composite.png"
            alt="Christmas portrait 4">
        </div>

      </div>


      <div class="bauble gold">

        <div class="cap"></div>

        <div class="photo-frame">
          <img
            src="hf_20261113_170037_3c6ed7af-8e7a-46c2-8f55-bb2b924ffc08.png"
            alt="Christmas portrait 5">
        </div>

      </div>


      <div class="bauble silver">

        <div class="cap"></div>

        <div class="photo-frame">
          <img
            src="hf_20261113_165833_c0d89066-ba90-43e5-8acf-f9b99e45a274.png"
            alt="Christmas portrait 6">
        </div>

      </div>

    </div>

  </div>


  <script>

    function updateCountdown() {

      const now = new Date();

      let christmas = new Date(
        now.getFullYear(),
        11,
        25,
        0,
        0,
        0
      );

      if (now > christmas) {

        christmas = new Date(
          now.getFullYear() + 1,
          11,
          25,
          0,
          0,
          0
        );

      }

      const difference =
        christmas - now;


      const days = Math.floor(
        difference /
        (1000 * 60 * 60 * 24)
      );


      const hours = Math.floor(
        (difference /
        (1000 * 60 * 60)) % 24
      );


      const minutes = Math.floor(
        (difference /
        (1000 * 60)) % 60
      );


      const seconds = Math.floor(
        (difference / 1000) % 60
      );


      document
        .getElementById("days")
        .textContent =
        days;


      document
        .getElementById("hours")
        .textContent =
        String(hours).padStart(2, "0");


      document
        .getElementById("minutes")
        .textContent =
        String(minutes).padStart(2, "0");


      document
        .getElementById("seconds")
        .textContent =
        String(seconds).padStart(2, "0");

    }


    function createSnow() {

      const snowContainer =
        document.getElementById("snow");

      const snowflakeCount = 90;

      const symbols = [
        "❄",
        "❅",
        "❆",
        "•"
      ];


      for (
        let i = 0;
        i < snowflakeCount;
        i++
      ) {

        const snowflake =
          document.createElement("span");


        snowflake.className =
          "snowflake";


        snowflake.textContent =
          symbols[
            Math.floor(
              Math.random() *
              symbols.length
            )
          ];


        snowflake.style.left =
          Math.random() * 100 + "vw";


        const size =
          7 + Math.random() * 18;


        snowflake.style.fontSize =
          size + "px";


        snowflake.style.opacity =
          0.3 +
          Math.random() * 0.7;


        const duration =
          7 + Math.random() * 13;


        snowflake.style.animationDuration =
          duration + "s";


        snowflake.style.animationDelay =
          -(Math.random() * duration) +
          "s";


        const drift =
          (Math.random() * 120) - 60;


        snowflake.style.setProperty(
          "--drift",
          drift + "px"
        );


        snowContainer.appendChild(
          snowflake
        );

      }

    }

    createSnow();

    updateCountdown();

    setInterval(
      updateCountdown,
      1000
    );

  </script>

</body>
</html>
